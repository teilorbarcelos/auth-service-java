name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build & Test
      run: mvn -B clean verify -DforkCount=1 -Dnet.bytebuddy.experimental=true
    - name: Check Coverage
      run: python3 scripts/check-coverage.py

  sonar:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Cache SonarQube scanners
      uses: actions/cache@v4
      with:
        path: ~/.sonar
        key: ${{ runner.os }}-sonar-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-sonar-
    - name: Install SonarScanner CLI
      run: |
        mkdir -p ~/.sonar
        if [ ! -d ~/.sonar/native-sonar-scanner/sonar-scanner-6.2.1.4610-linux-x64 ]; then
          cd /tmp
          wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q sonar-scanner-cli-6.2.1.4610-linux-x64.zip -d ~/.sonar/native-sonar-scanner
        fi
    - name: Run SonarQube Scan
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./scripts/sonar-scan.sh "auth-service-java" "Auth Service Java"
